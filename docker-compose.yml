services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mercadoya
      POSTGRES_PASSWORD: mercadoya_local
      POSTGRES_DB: mercadoya
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercadoya -d mercadoya"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  postgres_data:
