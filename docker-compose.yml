services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: mercadoya
      POSTGRES_PASSWORD: mercadoya_local
      POSTGRES_DB: mercadoya
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mercadoya -d mercadoya']
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ['-m', '8222']
    ports:
      - '4222:4222'
      - '8222:8222'

  inventory-v1:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      # Compatibilidad HTTP explícita y health; no consume eventos de stock.
      SERVICE_VERSION: v1
      DATABASE_URL: postgresql://mercadoya:mercadoya_local@postgres:5432/mercadoya
      NATS_URL: nats://nats:4222
      EVENT_BUS: nats
      CATALOG_URL: http://host.docker.internal:3001
      IDENTITY_URL: http://host.docker.internal:3001
      CATALOG_INTERNAL_TOKEN: ${CATALOG_INTERNAL_TOKEN:?Set CATALOG_INTERNAL_TOKEN in .env}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  inventory-v2:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    restart: unless-stopped
    ports:
      - '3005:3003'
    environment:
      # Default HTTP y único propietario de reserva/compensación NATS.
      SERVICE_VERSION: v2
      DATABASE_URL: postgresql://mercadoya:mercadoya_local@postgres:5432/mercadoya
      NATS_URL: nats://nats:4222
      EVENT_BUS: nats
      CATALOG_URL: http://host.docker.internal:3001
      IDENTITY_URL: http://host.docker.internal:3001
      CATALOG_INTERNAL_TOKEN: ${CATALOG_INTERNAL_TOKEN:?Set CATALOG_INTERNAL_TOKEN in .env}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

volumes:
  postgres_data:
