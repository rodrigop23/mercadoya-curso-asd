services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: mercadoya
      POSTGRES_PASSWORD: mercadoya_local
      POSTGRES_DB: mercadoya
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mercadoya -d mercadoya']
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ['-m', '8222']
    ports:
      - '4222:4222'
      - '8222:8222'

  inventory-v1:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:3003:3003'
    environment:
      # Compatibilidad HTTP explícita y health; no consume eventos de stock.
      SERVICE_VERSION: v1
      DATABASE_URL: postgresql://mercadoya:mercadoya_local@postgres:5432/mercadoya
      NATS_URL: nats://nats:4222
      EVENT_BUS: nats
      CATALOG_URL: http://catalog:3007
      IDENTITY_URL: http://identity:3006
      JWT_ISSUER: http://localhost:8000
      JWT_AUDIENCE: mercadoya-services
      CATALOG_INTERNAL_TOKEN: ${CATALOG_INTERNAL_TOKEN:?Set CATALOG_INTERNAL_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  inventory-v2:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:3005:3003'
    environment:
      # Default HTTP y único propietario de reserva/compensación NATS.
      SERVICE_VERSION: v2
      DATABASE_URL: postgresql://mercadoya:mercadoya_local@postgres:5432/mercadoya
      NATS_URL: nats://nats:4222
      EVENT_BUS: nats
      CATALOG_URL: http://catalog:3007
      IDENTITY_URL: http://identity:3006
      JWT_ISSUER: http://localhost:8000
      JWT_AUDIENCE: mercadoya-services
      CATALOG_INTERNAL_TOKEN: ${CATALOG_INTERNAL_TOKEN:?Set CATALOG_INTERNAL_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  identity:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mercadoya:mercadoya_local@postgres:5432/mercadoya
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost:8000
      JWT_ISSUER: http://localhost:8000
      JWT_AUDIENCE: mercadoya-services
      IDENTITY_URL: http://127.0.0.1:3006
    ports:
      - '127.0.0.1:3006:3006'
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mercadoya:mercadoya_local@postgres:5432/mercadoya
      IDENTITY_URL: http://identity:3006
      JWT_ISSUER: http://localhost:8000
      JWT_AUDIENCE: mercadoya-services
      CATALOG_INTERNAL_TOKEN: ${CATALOG_INTERNAL_TOKEN:?Set CATALOG_INTERNAL_TOKEN}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-polar}
      POLAR_SERVER: ${POLAR_SERVER:-sandbox}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      UPLOADS_DIR: /app/uploads
    ports:
      - '127.0.0.1:3007:3007'
    volumes:
      - ./apps/catalog-service/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  orders:
    build:
      context: .
      dockerfile: apps/orders-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mercadoya:mercadoya_local@postgres:5432/mercadoya
      IDENTITY_URL: http://identity:3006
      JWT_ISSUER: http://localhost:8000
      JWT_AUDIENCE: mercadoya-services
      NATS_URL: nats://nats:4222
      EVENT_BUS: nats
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-polar}
      CATALOG_URL: http://catalog:3007
      CATALOG_INTERNAL_TOKEN: ${CATALOG_INTERNAL_TOKEN:?Set CATALOG_INTERNAL_TOKEN}
      POLAR_SERVER: ${POLAR_SERVER:-sandbox}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_WEB_ORIGIN: ${POLAR_WEB_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  notifications:
    build:
      context: .
      dockerfile: apps/notifications-lambda/Dockerfile
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
      EVENT_BUS: nats
      EMAIL_MODE: ${EMAIL_MODE:-stub}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      DEMO_NOTIFY_EMAIL: ${DEMO_NOTIFY_EMAIL:-}
      NOTIFICATIONS_FUNCTION_URL: ${NOTIFICATIONS_FUNCTION_URL:-}
      NOTIFICATIONS_INVOKE_TOKEN: ${NOTIFICATIONS_INVOKE_TOKEN:?Set NOTIFICATIONS_INVOKE_TOKEN}
    depends_on:
      nats:
        condition: service_started

  kong:
    build:
      context: .
      dockerfile: infra/kong/Dockerfile
    restart: unless-stopped
    environment:
      KONG_DATABASE: 'off'
      KONG_NGINX_WORKER_PROCESSES: '2'
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PLUGINS: bundled,identity-auth
      KONG_ADMIN_LISTEN: 'off'
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 3m
    ports:
      - '8000:8000'
    volumes:
      - ./infra/kong/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      - identity
      - catalog
      - orders
      - inventory-v1
      - inventory-v2
      - notifications

volumes:
  postgres_data:
