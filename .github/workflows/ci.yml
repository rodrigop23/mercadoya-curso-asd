name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # pnpm 11+, packageManager fija pnpm y .node-version fija Node.
      # La cache contiene el store; no node_modules ni resultados de Turbo.
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Validate versioned OpenAPI and generated schemas
        run: pnpm openapi:check
      - name: Test
        run: pnpm test
