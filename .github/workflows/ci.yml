name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # pnpm 11+, packageManager fija pnpm y .node-version fija Node.
      # La cache contiene el store; no node_modules ni resultados de Turbo.
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all workspaces including shared UI
        run: pnpm typecheck
      - name: Lint all workspaces including shared UI
        run: pnpm lint
      - name: Build all consumers including web and mf-catalog
        run: pnpm build
      - name: Validate versioned OpenAPI and generated schemas
        run: pnpm openapi:check
      - name: Test
        run: pnpm test

  federation-smoke:
    name: Federation dev and preview smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mercadoya/web exec playwright install --with-deps chromium
      - name: Build host and remote
        run: pnpm exec turbo run build --filter=@mercadoya/web --filter=@mercadoya/mf-catalog
      - name: Preview federation, singleton identity, CRUD, guards and remote failure
        run: pnpm --filter @mercadoya/web smoke:federation
      - name: Dev federation, singleton identity, CRUD, guards and remote failure
        env:
          MF_SMOKE_MODE: dev
        run: pnpm --filter @mercadoya/web smoke:federation
      - name: Build host consuming the remote manifest
        env:
          VITE_MF_CATALOG_ENTRY: http://localhost:5174/mf-manifest.json
        run: pnpm exec turbo run build --filter=@mercadoya/web
      - name: Preview manifest federation
        run: pnpm --filter @mercadoya/web smoke:federation

  identity-gateway-smoke:
    name: Identity, Catalog and Kong smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral credentials
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const names = ['BETTER_AUTH_SECRET', 'CATALOG_INTERNAL_TOKEN', 'NOTIFICATIONS_INGEST_TOKEN', 'NOTIFICATIONS_INVOKE_TOKEN'];
          const values = names.map(name => `${name}=${randomBytes(48).toString('base64url')}`);
          writeFileSync('.env', values.join('\n') + '\nDATABASE_URL=postgresql://mercadoya:mercadoya_local@localhost:5432/mercadoya\n', { mode: 0o600 });
          JS
      - name: Initialize infrastructure and migrations
        run: |
          docker compose up -d --wait postgres nats
          pnpm --filter @mercadoya/catalog-service db:migrate
          pnpm --filter @mercadoya/identity-service db:migrate
          pnpm --filter @mercadoya/jwt-verifier build
      - name: Build and start Kong OSS and services
        run: |
          mkdir -p apps/api/uploads
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose up -d --build
      - name: Login, JWKS, Catalog CRUD and saga smoke
        env:
          DATABASE_URL: postgresql://mercadoya:mercadoya_local@localhost:5432/mercadoya
        run: |
          set -a
          . ./.env
          set +a
          pnpm --filter @mercadoya/identity-service smoke
      - name: Saga compensation and duplicate events
        run: |
          set -a
          . ./.env
          set +a
          docker compose exec -T postgres psql -U mercadoya -d mercadoya -c "INSERT INTO product (title, description, price, stock, image_path) VALUES ('Saga CI', 'Producto de prueba', 10, 5, 'media/saga-ci.png')"
          docker compose run --rm --no-deps -e CATALOG_URL=http://catalog:3007 -e GATEWAY_URL=http://kong:8000 -e CATALOG_INTERNAL_TOKEN orders node dist/demo-saga.js
      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Cleanup ephemeral stack
        if: always()
        run: docker compose down -v --remove-orphans
