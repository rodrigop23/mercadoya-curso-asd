# SonarQube project configuration for the Mercado Ya monorepo.
# Authentication must be provided outside this file:
#   SONAR_TOKEN=<project-token>
# Override sonar.host.url in CI if the server is not local.

# Project identity
sonar.projectKey=mercadoya-asd
sonar.projectName=Mercado Ya

# SonarQube Server URL. Change it in CI if your instance is not local.
sonar.host.url=http://localhost:8008

# Application, shared package, automation, and infrastructure sources.
# Test inclusions also exclude matching files from the production scope.
sonar.sources=apps,packages,scripts,infra
sonar.tests=apps,packages,tests
sonar.test.inclusions=\
  apps/**/test/**,\
  apps/**/tests/**,\
  packages/**/test/**,\
  packages/**/tests/**,\
  **/*.test.*,\
  **/*.spec.*,\
  **/*.integration.*,\
  **/*.test-utils.*,\
  tests/**/*

# TypeScript semantic analysis
sonar.typescript.tsconfigPaths=apps/*/tsconfig.json,packages/*/tsconfig.json

# Current test commands do not generate coverage reports.
# Enable these paths after configuring LCOV and Python Cobertura reporters.
# sonar.javascript.lcov.reportPaths=coverage/lcov.info,apps/*/coverage/lcov.info,packages/*/coverage/lcov.info
# sonar.python.coverage.reportPaths=apps/*/coverage.xml

# Encoding required for JavaScript/TypeScript analysis.
sonar.sourceEncoding=UTF-8

# Keep generated files, dependencies, build output, local env files,
# and transient tool directories out of the analysis.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.turbo/**,\
  **/cdk.out/**,\
  **/.vite/**,\
  **/.vite-temp/**,\
  **/.cache/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/.ruff_cache/**,\
  **/.pytest_cache/**,\
  **/.import_linter_cache/**,\
  **/.langgraph_api/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  **/uploads/**,\
  **/*.local,\
  **/.env*,\
  **/*.tsbuildinfo,\
  apps/web/src/routeTree.gen.ts,\
  apps/catalog-service/drizzle/meta/**

# Apply artifact exclusions to the test scope as well.
sonar.test.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  tests/perf/out/**

# Git metadata and CI behavior
sonar.scm.provider=git
sonar.qualitygate.wait=true
