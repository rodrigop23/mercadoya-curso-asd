# Generado por @mercadoya/contracts. No editar; ejecutar pnpm openapi:generate.
openapi: 3.1.0
info:
  title: MercadoYa Media
  version: 1.0.0
  description: La ruta estática /uploads/* la monta Catalog. La entrada de Media es image en multipart de Catalog; no hay upload HTTP autónomo. Kong proxifica Catalog y Media; Polar queda para decisiones futuras.
servers:
  - url: http://localhost:8000
    description: Kong OSS local; los paths incluyen /api.
paths:
  /api/media/health:
    get:
      operationId: mediaHealth
      summary: Estado de Media
      security: []
      responses:
        "200":
          description: El proceso responde.
          content:
            application/json:
              schema:
                type: object
                required:
                  - module
                  - ok
                properties:
                  module:
                    type: string
                    const: media
                  ok:
                    type: boolean
                    const: true
  /uploads/{file}:
    get:
      operationId: readUpload
      summary: Leer una imagen publicada por Catalog
      security: []
      responses:
        "200":
          description: Imagen full o thumb.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Archivo no encontrado; respuesta del middleware estático.
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
components:
  securitySchemes:
    applicationJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256, kid, sub, role, iss=http://localhost:8000, aud=mercadoya-services, iat y exp. Directo al servicio requiere Bearer; Kong admite también sesión browser.
    betterAuthSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Cookie Better Auth local. En HTTPS puede usar el prefijo __Secure-. No es Bearer JWT.
  schemas: {}
