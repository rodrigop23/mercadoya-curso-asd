[project]
name = "mercadoya-mcp"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==2.3.0", "httpx==0.28.1", "uvicorn==0.42.0"]

[dependency-groups]
dev = [
    "import-linter==2.15",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mercadoya_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
testpaths = ["tests"]
