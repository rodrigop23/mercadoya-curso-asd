[project]
name = "mercadoya-agent-service"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "langgraph==1.2.14",
  "langchain-core==1.6.9",
  "langgraph-sdk==0.4.6",
  "langchain-openai==1.7.0",
  "langsmith==0.14.7",
  "PyJWT[crypto]==2.15.1",
  "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0",
]

[dependency-groups]
dev = [
  "langgraph-cli[inmem]==0.4.33",
  "langgraph-api==0.16.0",
  "pytest==9.1.1",
  "ruff==0.17.0",
  "jsonschema==4.26.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
