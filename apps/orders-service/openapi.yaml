# Generado por @mercadoya/contracts. No editar; ejecutar pnpm openapi:generate.
openapi: 3.1.0
info:
  title: MercadoYa Orders
  version: 2.3.0
  description: Kong acepta sesión browser o JWT para pedidos y checkout. Orders directo requiere Bearer JWT verificado por JWKS. Health y webhook Polar públicos; webhook usa firma Standard Webhooks.
servers:
  - url: http://localhost:8000
    description: Kong OSS local; los paths incluyen /api.
  - url: http://localhost:3002
    description: Orders directo.
paths:
  /api/orders/health:
    get:
      operationId: ordersHealth
      summary: Estado de Orders
      security: []
      responses:
        "200":
          description: El proceso responde.
          content:
            application/json:
              schema:
                type: object
                required:
                  - module
                  - ok
                properties:
                  module:
                    type: string
                    const: orders
                  ok:
                    type: boolean
                    const: true
  /api/orders:
    get:
      operationId: listOrders
      summary: Consultar el historial de pedidos del comprador
      security:
        - betterAuthSession: []
        - applicationJWT: []
      responses:
        "200":
          description: Pedidos del comprador, del más reciente al más antiguo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersResponse"
        "401":
          description: Falta una sesión o credencial válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falló la operación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: El servicio remoto no está disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "El comprador procede de la sesión verificada. Incluye pedidos pendientes, confirmados y rechazados, ordenados por createdAt descendente y por id descendente en caso de empate. No acepta un buyerId del cliente. Cache-Control: no-store."
    post:
      operationId: createOrder
      summary: Crear un pedido pendiente y publicar orders.placed
      security:
        - betterAuthSession: []
        - applicationJWT: []
      responses:
        "202":
          description: Pedido aceptado; la saga resuelve el estado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Falta una sesión o credencial válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El producto aún no admite pagos o el importe supera el límite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falló la operación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: El servicio remoto no está disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Servicio no disponible o configuración incompleta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      description: buyerId procede del claim sub verificado. Acepta productId/quantity para pedidos anteriores, o items con hasta 20 productos distintos para un carrito. Catalog debe tener todos sincronizados. Orders guarda precios PEN, títulos y miniaturas antes de publicar. idempotencyKey permite recuperar el mismo pedido sin reservar o cobrar dos veces. Campos extra como moneda o importe se descartan.
  /api/orders/{orderId}:
    get:
      operationId: getOrder
      summary: Consultar un pedido autenticado
      security:
        - betterAuthSession: []
        - applicationJWT: []
      responses:
        "200":
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Falta una sesión o credencial válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falló la operación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: El servicio remoto no está disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      description: "Solo el comprador puede consultar el pedido y sus líneas. Cache-Control: no-store."
  /api/orders/{orderId}/checkout:
    get:
      operationId: getPaymentCheckout
      summary: Consultar el checkout Polar del comprador
      security:
        - betterAuthSession: []
        - applicationJWT: []
      responses:
        "200":
          description: Checkout Polar listo o pedido finalizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCheckoutResponse"
        "202":
          description: Reserva o creación de checkout pendiente; repetir consulta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCheckoutResponse"
        "400":
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Falta una sesión o credencial válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Servicio no disponible o configuración incompleta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      description: "Solo el comprador puede consultar el enlace. El importe se fija en el servidor para todas las unidades. Respuesta Cache-Control: no-store."
  /api/payments/polar/webhook:
    post:
      operationId: polarWebhook
      summary: Aceptar un webhook firmado de Polar API 2026-04
      security: []
      responses:
        "202":
          description: Firma y payload verificados; evento persistido o ignorado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - received
                properties:
                  received:
                    type: boolean
                    const: true
        "400":
          description: Payload o versión de evento inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Firma o timestamp inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Payload supera 262144 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Inbox no disponible o Polar no activo; Polar debe reintentar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: Público en Kong, sin JWT. Standard Webhooks firma webhook-id.timestamp.rawBody; la URL no forma parte del HMAC. Configurar esta URL final sin redirects y formato Raw en Polar. Idempotencia por webhook-id. No enviar datos de cliente ni secretos en ejemplos.
      parameters:
        - name: webhook-id
          in: header
          required: true
          schema:
            type: string
        - name: webhook-timestamp
          in: header
          required: true
          schema:
            type: string
        - name: webhook-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - timestamp
                - data
              properties:
                type:
                  type: string
                timestamp:
                  type: string
                  format: date-time
                data:
                  type: object
