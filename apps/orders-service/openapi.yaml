# Generado por @mercadoya/contracts. No editar; ejecutar pnpm openapi:generate.
openapi: 3.1.0
info:
  title: MercadoYa Orders
  version: 2.0.0
  description: Kong acepta sesión browser o JWT. Orders directo requiere Bearer JWT verificado por JWKS. Health público.
servers:
  - url: http://localhost:8000
    description: Kong OSS local; los paths incluyen /api.
  - url: http://localhost:3002
    description: Orders directo.
paths:
  /api/orders/health:
    get:
      operationId: ordersHealth
      summary: Estado de Orders
      security: []
      responses:
        '200':
          description: El proceso responde.
          content:
            application/json:
              schema:
                type: object
                required:
                  - module
                  - ok
                properties:
                  module:
                    type: string
                    const: orders
                  ok:
                    type: boolean
                    const: true
  /api/orders:
    post:
      operationId: createOrder
      summary: Crear un pedido pendiente y publicar orders.placed
      security:
        - betterAuthSession: []
        - applicationJWT: []
      responses:
        '202':
          description: Pedido aceptado; la saga resuelve el estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta una sesión o credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Falló la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: El servicio remoto no está disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      description: buyerId procede del claim sub verificado. Campos extra como paymentMode se descartan; solo el CLI interno usa ese override.
  /api/orders/{orderId}:
    get:
      operationId: getOrder
      summary: Consultar un pedido autenticado
      security:
        - betterAuthSession: []
        - applicationJWT: []
      responses:
        '200':
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Falló la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: El servicio remoto no está disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
components:
  securitySchemes:
    applicationJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256, kid, sub, role, iss=http://localhost:8000, aud=mercadoya-services, iat y exp. Directo al servicio requiere Bearer; Kong admite también sesión browser.
    betterAuthSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Cookie Better Auth local. En HTTPS puede usar el prefijo __Secure-. No es Bearer JWT.
  schemas:
    OrderResponse:
      type: object
      properties:
        order:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            productId:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            quantity:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            buyerId:
              type:
                - string
                - 'null'
            status:
              type: string
              enum:
                - pending
                - confirmed
                - rejected
            rejectionReason:
              type:
                - string
                - 'null'
            createdAt:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            updatedAt:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          required:
            - id
            - productId
            - quantity
            - buyerId
            - status
            - rejectionReason
            - createdAt
            - updatedAt
      required:
        - order
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - error
    CreateOrder:
      type: object
      properties:
        productId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        quantity:
          type: integer
          exclusiveMinimum: 0
          maximum: 2147483647
      required:
        - productId
        - quantity
