scan:
  scanners:
    - vuln
    - secret
    - misconfig
  skip-dirs:
    - '**/node_modules'
    - '**/.venv'
    - '**/dist'
    - '**/cdk.out'
    - '**/.git'
    - tests/perf/out
  skip-files:
    - '.env'
    - '**/.env'
    - '**/.env.evals'
severity:
  - HIGH
  - CRITICAL
exit-code: 1
vulnerability:
  ignore-unfixed: true
ignorefile: .trivyignore.yaml
pkg:
  include-dev-deps: true
rego:
  check: [tests/security/policies]
  namespaces: [builtin, mercadoya]
misconfiguration:
  scanners: [dockerfile, kubernetes, terraform, cloudformation, helm, azure-arm, yaml]
file-patterns:
  - 'yaml:.*\.ya?ml$'
secret:
  config: trivy-secret.yaml
